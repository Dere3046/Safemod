name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.kmi }}
        run: |
          docker run --rm --privileged \
            -v "$PWD/kernel:/src" -w /src \
            ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313 \
            make

      - uses: actions/upload-artifact@v4
        with:
          name: safemod-${{ matrix.kmi }}
          path: kernel/safemod.ko
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: safemod-*
          merge-multiple: true
          path: ko

      - uses: softprops/action-gh-release@v2
        with:
          files: ko/*.ko
          generate_release_notes: true
