name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch kallrecon
        run: git clone --depth 1 https://github.com/Dere3046/KallRecon.git kernel/kallrecon

      - name: Build ${{ matrix.kmi }}
        run: |
          docker run --rm --privileged \
            -v "$PWD/kernel:/src" -w /src \
            ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313 \
            make

      - name: Rename
        run: mv kernel/safemod.ko kernel/safemod-${{ matrix.kmi }}.ko

      - uses: actions/upload-artifact@v4
        with:
          name: safemod-${{ matrix.kmi }}
          path: kernel/safemod-${{ matrix.kmi }}.ko
          if-no-files-found: error

  module:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: safemod-android*
          merge-multiple: true
          path: kos

      - name: Assemble module
        run: |
          set -e
          mkdir -p module/lib/arm64-v8a/lkm
          cp kos/*.ko module/lib/arm64-v8a/lkm/
          chmod 755 module/*.sh module/lib/arm64-v8a/safemod-user.sh
          cd module
          zip -r9 ../safemod-module.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: safemod-module
          path: safemod-module.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, module]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: safemod-android*
          merge-multiple: true
          path: ko

      - uses: actions/download-artifact@v4
        with:
          name: safemod-module
          path: mod

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ko/*.ko
            mod/safemod-module.zip
          generate_release_notes: true
